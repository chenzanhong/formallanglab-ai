version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

output:
  sort-results: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - nilerr
    - errchkjson
    - errname
    - noctx
    - contextcheck
    - bodyclose
    - forcetypeassert
    - nilnil
    - whitespace
    - revive
    - misspell
    - gocritic
    - funlen
    - gocognit
    - unparam
    - prealloc
    - nlreturn
    - nestif

  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: error-return
        - name: redefines-builtin-id
        - name: range
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
    misspell:
      locale: US
    funlen:
      lines: 90
      statements: 0
      ignore-comments: true
    nlreturn:
      block-size: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false

  new: false
  whole-files: true

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/chenzanhong/formallanglab-ai)
      custom-order: true
